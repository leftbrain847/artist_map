# Nightly: rebuild the map from Spotify + Last.fm and publish it to GitHub Pages.
# Secrets reach only the build steps that need them. Logs show counts, never values.
name: build
on:
  schedule:
    - cron: "41 8 * * *" # 3:41am Eastern
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also save today's sprint snapshot to a branch for a PR"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      reconnect: ${{ steps.build.outputs.reconnect }}
      reconnect_by: ${{ steps.build.outputs.reconnect_by }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the map
        id: build
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_CONNECTED_AT: ${{ secrets.SPOTIFY_CONNECTED_AT }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          NEW_REFRESH_FILE: ${{ runner.temp }}/new_refresh
        run: node src/build.mjs
      - name: Save Spotify's replacement sign-in token, if it sent one
        env:
          GH_TOKEN: ${{ secrets.ARTIST_MAP_SECRETS_TOKEN }}
          FILE: ${{ runner.temp }}/new_refresh
        run: |
          if [ -s "$FILE" ]; then
            gh secret set SPOTIFY_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$FILE"
            echo "saved a replacement sign-in token"
          fi
          rm -f "$FILE"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Fails on purpose so GitHub emails J before the Spotify sign-in runs out.
  reconnect:
    needs: build
    if: needs.build.outputs.reconnect == 'due'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          BY: ${{ needs.build.outputs.reconnect_by }}
        run: |
          echo "::error::The Spotify sign-in expires around $BY. Open the map's connect page and sign in again."
          exit 1

  # On request: rebuild and freeze today's page as the sprint snapshot, on a branch J's session turns into a PR.
  snapshot:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the map
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_CONNECTED_AT: ${{ secrets.SPOTIFY_CONNECTED_AT }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node src/build.mjs
      - name: Freeze it on a branch
        run: |
          node scripts/snapshot.mjs dist/index.html
          day=$(TZ=America/New_York date +%F)
          git switch -c "snapshot_$day"
          git add snapshots
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sprint snapshot $day"
          git push origin "snapshot_$day"
